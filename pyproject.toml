[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "journai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
journai = "journai.cli:main"

[tool.setuptools]
packages = ["journai"]

[tool.setuptools.package-data]
journai = ["migrations/*.sql", "fixtures/*.json"]
