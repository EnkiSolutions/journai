[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "journai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.12.12", "mypy==1.17.1"]

[project.scripts]
journai = "journai.cli:main"

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true

[tool.setuptools]
packages = ["journai"]

[tool.setuptools.package-data]
journai = ["migrations/*.sql", "fixtures/*.json"]
